<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">EcoSolicitud</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/design.css}">
    <link rel="stylesheet" th:if="${!#strings.isEmpty(tema)}"
          th:href="@{'/css/temas/' + ${tema} + '.css'}">
    <link rel="stylesheet" th:if="${demoHabilitada}" th:href="@{/css/demo.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#434a27">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" th:content="#{app.nombre}">
    <link rel="apple-touch-icon" th:href="@{/img/icon-180.png}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
</head>
<body hx-boost="true" hx-indicator="#carga">
    <div id="carga" class="carga" aria-hidden="true"></div>
    <div id="estado-red" class="solo-lectores" role="status"
         th:attr="data-cargando=#{app.cargando},data-confirmar=#{accion.confirmar}"
         style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0"></div>
    <a class="salto" href="#contenido" th:text="#{nav.saltar}">Saltar al contenido</a>
    <div class="app">
        <aside class="sidebar">
            <header>
                <a th:href="@{${rutas.RAIZ}}">
                    <img th:src="@{/img/logo.svg}" alt="">
                    <span th:text="#{app.nombre}">EcoSolicitud</span>
                </a>
                <p th:fragment="idiomas">
                    <a th:href="${rutaActual} + '?lang=es'"
                       th:classappend="${#locale.language == 'es'} ? 'activa'"><svg aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#bandera-es'"></use></svg><span>ES</span></a>
                    <a th:href="${rutaActual} + '?lang=pt'"
                       th:classappend="${#locale.language == 'pt'} ? 'activa'"><svg aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#bandera-pt'"></use></svg><span>PT</span></a>
                </p>
            </header>
            <nav th:fragment="secciones" class="secciones" th:aria-label="#{nav.secciones}">
                <ul>
                    <li th:each="s : ${secciones}">
                        <a th:href="${s.ruta}"
                           th:attr="aria-current=${s.ruta == rutaActual} ? 'page' : null">
                            <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${s.icono}"></use></svg>
                            <span th:text="#{${s.clave}}">Sección</span>
                            <span class="badge-live" th:if="${s.name() == 'AVISOS'}"
                                  th:attr="hx-get=@{${rutas.AVISOS_CONTADOR}}"
                                  hx-trigger="every 30s" hx-swap="innerHTML"
                                  aria-live="polite">
                                <span th:replace="~{secciones/badge :: badge}"></span>
                            </span>
                        </a>
                    </li>
                </ul>
            </nav>
            <footer th:fragment="pie">
                <details class="demo-bloque">
                    <summary class="demo" th:text="#{demo.etiqueta}">Modo demostración</summary>
                <p class="demo-nota" th:text="#{demo.centros}"></p>
                <form th:action="@{${rutas.DEMO_ROL}}" method="post" class="rol-switch" hx-indicator="this">
                    <button type="submit" name="rol" value="CIUDADANO"
                            th:classappend="${rolActual.name() == 'CIUDADANO'} ? 'activa'"
                            th:attr="aria-pressed=${rolActual.name() == 'CIUDADANO'}"
                            th:text="#{rol.ciudadano}">Ciudadano</button>
                    <button type="submit" name="rol" value="ORGANIZACION"
                            th:classappend="${rolActual.name() == 'ORGANIZACION'} ? 'activa'"
                            th:attr="aria-pressed=${rolActual.name() == 'ORGANIZACION'}"
                            th:text="#{rol.organizacion}">Organización</button>
                </form>
                <form th:if="${rolActual.name() == 'ORGANIZACION'}"
                      th:action="@{${rutas.DEMO_ORGANIZACION}}" method="post" class="org-switch" hx-indicator="this">
                    <label for="org-select" th:text="#{demo.acopio}">Acopio</label>
                    <select id="org-select" name="id">
                        <option th:each="o : ${organizaciones}" th:value="${o.id}"
                                th:text="${o.nombre}"
                                th:selected="${o.id == organizacionActiva.id}"></option>
                    </select>
                    <input type="hidden" name="volver" th:value="${rutaActual}">
                    <button type="submit" th:text="#{demo.cambiar}">Cambiar</button>
                </form>
                <form th:if="${demoHabilitada and demoReinicio}"
                      th:action="@{${rutas.DEMO_REINICIAR}}" method="post" class="reiniciar" hx-indicator="this">
                    <input type="hidden" name="volver" th:value="${rutaActual}">
                    <button type="submit"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#basurero'"></use></svg><span th:text="#{demo.reiniciar}">Borrar</span></button>
                </form>
                </details>
                <figure class="qr" th:if="${qr != null}">
                    <span th:utext="${qr}"></span>
                    <figcaption th:text="#{nav.compartir}">Compartí EcoSolicitud</figcaption>
                </figure>
                <a class="instalar-app" href="#" hidden><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#descargar'"></use></svg><span th:text="#{instalar.boton}">Instalar</span></a>
                <a href="https://commons.wikimedia.org/wiki/User:Mx._Granger"
                   rel="noopener" target="_blank" th:text="#{foto.credito}">Fotos</a>
            </footer>
        </aside>
        <div class="menu-movil">
            <header>
                <a th:href="@{${rutas.RAIZ}}">
                    <img th:src="@{/img/logo.svg}" alt="">
                    <span th:text="#{app.nombre}">EcoSolicitud</span>
                </a>
                <p th:replace="~{app :: idiomas}"></p>
            </header>
            <details>
                <summary th:aria-label="#{nav.menu}">
                    <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#menu'"></use></svg>
                </summary>
                <nav th:replace="~{app :: secciones}"></nav>
                <footer th:replace="~{app :: pie}"></footer>
            </details>
        </div>
        <div class="pagina">
            <p th:fragment="datosDemo" class="datos-demo" th:if="${demoHabilitada}"
               th:text="#{app.datos.prueba}">Todos los datos son de prueba</p>
            <nav th:replace="~{secciones/migas :: migas}"></nav>
            <main class="contenido" id="contenido" layout:fragment="content"></main>
        </div>
    </div>
    <script>
        // anuncia a lectores de pantalla solo peticiones lentas (>600ms):
        // una navegación instantánea no necesita aviso
        var avisoRed;
        function estadoRed() {
            return document.getElementById('estado-red');
        }
        // el script corre de nuevo en cada navegación boosteada: los listeners
        // globales se registran una vez y sobre document (document.body
        // persiste y acumularía listeners, document no)
        if (!window.__appInit) {
            window.__appInit = true;
            document.addEventListener('htmx:beforeRequest', function () {
                clearTimeout(avisoRed);
                avisoRed = setTimeout(function () {
                    var el = estadoRed();
                    if (el) { el.textContent = el.dataset.cargando; }
                }, 600);
            });
            document.addEventListener('htmx:afterRequest', function () {
                clearTimeout(avisoRed);
                var el = estadoRed();
                if (el) { el.textContent = ''; }
            });
            // todo botón "peligro" confirma antes de enviar; un hx-confirm propio gana
            document.addEventListener('htmx:confirm', function (e) {
                var boton = e.detail.elt.querySelector && e.detail.elt.querySelector('button.peligro');
                var el = estadoRed();
                if (!boton || !el || e.detail.elt.hasAttribute('hx-confirm')) { return; }
                e.preventDefault();
                if (confirm(el.dataset.confirmar.replace('{0}', boton.textContent.trim()))) {
                    e.detail.issueRequest(true);
                }
            });
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js');
            }
            // el evento es del navegador, no de la página: la promesa queda en
            // window porque los enlaces .instalar-app se recrean en cada swap
            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                window.__pendienteInstalar = e;
                document.querySelectorAll('.instalar-app')
                        .forEach(function (el) { el.hidden = false; });
            });
            window.addEventListener('appinstalled', function () {
                window.__pendienteInstalar = null;
                document.querySelectorAll('.instalar-app')
                        .forEach(function (el) { el.hidden = true; });
            });
        }
        // botón "Instalar": solo se muestra cuando el navegador confirma
        // que el PWA es instalable (HTTPS/localhost + manifest + SW);
        // los enlaces son nodos nuevos tras cada swap, se enlazan por página
        document.querySelectorAll('.instalar-app').forEach(function (el) {
            el.addEventListener('click', function (ev) {
                ev.preventDefault();
                if (window.__pendienteInstalar) {
                    window.__pendienteInstalar.prompt();
                }
            });
        });
    </script>
</body>
</html>
