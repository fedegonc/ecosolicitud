<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.acopios}">Centros de acopio</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.acopios}">Centros de acopio</h1>
    <section th:each="g : ${grupos}">
        <h2 th:text="#{${g.ciudad.clave}}">Ciudad</h2>
        <div class="rejilla">
            <article th:each="o : ${g.organizaciones}" class="tarjeta">
                <h3 th:text="${o.nombre}">Nombre</h3>
                <p class="detalle">
                    <span th:text="${o.horario}">Horario</span> ·
                    <a class="enlace" th:href="'tel:' + ${#strings.replace(o.telefono, ' ', '')}"
                       th:text="${o.telefono}">Teléfono</a>
                </p>
                <ul class="materiales">
                    <li th:each="m : ${o.materiales}" th:class="'etiqueta-material ' + 'mat-' + ${#strings.toLowerCase(m.name())}"
                        th:text="#{${m.clave}}">Material</li>
                </ul>
                <p><a class="accion secundaria"
                      th:href="@{/nueva(ciudad=${o.ciudad},organizacionId=${o.id})}"
                      th:text="#{acopios.pedir}">Pedir retiro</a></p>
            </article>
        </div>
    </section>
</main>
</body>
</html>
