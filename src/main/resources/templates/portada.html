<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{app.nombre}">EcoSolicitud</title>
</head>
<body>
<main layout:fragment="content">
    <section class="portada">
        <div class="portada-hero">
            <div class="portada-texto">
                <h1 th:text="#{portada.claim}">Qué es</h1>
                <p class="detalle" th:text="#{portada.intro}">Intro</p>
                <p class="acciones-portada">
                    <a class="accion cta" th:href="${inicio}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg><span th:text="#{${cta}}">Pedir retiro</span></a>
                    <a class="enlace" th:href="@{/acopios}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#edificio'"></use></svg><span th:text="#{portada.secundaria}">Ver centros</span></a>
                </p>
            </div>
            <figure class="foto-hero">
                <img th:src="@{/img/ciudad/plaza-1600.webp}"
                     th:attr="srcset=@{/img/ciudad/plaza-800.webp} + ' 800w, ' + @{/img/ciudad/plaza-1600.webp} + ' 1600w'"
                     sizes="(min-width: 45rem) 21rem, 50vw" width="1600" height="1200"
                     fetchpriority="high" th:alt="#{foto.plaza}">
            </figure>
        </div>
        <figure class="qr">
            <span th:utext="${qr}"></span>
            <figcaption class="detalle" th:text="#{portada.compartir}">Compartí</figcaption>
        </figure>
    </section>
    <section class="noticias-comunidad" aria-labelledby="noticias-titulo">
        <h2 id="noticias-titulo" th:text="#{portada.ultimas}">Lo último de la comunidad</h2>
        <p class="detalle" th:text="#{noticias.fotos.ilustrativas}">Fotos ilustrativas de reciclaje.</p>
        <div class="rejilla">
            <article th:each="p : ${ultimas}" class="tarjeta" th:with="clave=${'noticias.' + p}">
                <img class="tarjeta-img" th:src="@{${#messages.msg(clave + '.imagen')}}"
                     th:alt="#{${clave + '.alt'}}" width="800" height="450" loading="lazy">
                <p class="noticia-credito detalle" th:text="#{${clave + '.credito'}}">Foto: autor / Unsplash</p>
                <h3><a class="enlace" th:href="#{${clave + '.fuente'}}" target="_blank" rel="noopener"
                       th:text="#{${clave + '.titulo'}}">Título</a></h3>
                <p class="detalle" th:text="#{${clave + '.texto'}}">Resumen</p>
                <p class="detalle">
                    <span class="etiqueta" th:text="#{${clave + '.tipo'}}">Historia</span>
                    <time th:datetime="#{${clave + '.fecha'}}"
                          th:text="#{${clave + '.fecha.visible'}}">Fecha de la fuente</time>
                </p>
                <a class="enlace noticia-fuente" th:href="#{${clave + '.fuente'}}" target="_blank" rel="noopener"
                   th:aria-label="#{noticias.ver.mas.titulo(${#messages.msg(clave + '.titulo')})}"
                   th:text="#{noticias.ver.mas}">Ver más</a>
            </article>
        </div>
    </section>
</main>
</body>
</html>
