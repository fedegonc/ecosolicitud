<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.comunidad}">Comunidad</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.comunidad}">Comunidad</h1>
    <div id="listado">
        <nav class="fila">
            <a class="caja" th:each="f : ${filtros}" th:href="@{${rutas.COMUNIDAD}(tipo=${#strings.toLowerCase(f.name())})}"
               th:classappend="${f == filtro} ? 'activa'" th:attr="aria-current=${f == filtro} ? 'page' : null"
               hx-target="#listado" hx-select="#listado" hx-swap="outerHTML" hx-push-url="true"
               th:text="#{${'comunidad.filtro.' + #strings.toLowerCase(f.name())}}">Todas</a>
        </nav>
        <p th:if="${publicaciones.isEmpty()}" th:text="#{comunidad.vacia}">Vacía</p>
        <div class="rejilla">
        <article th:each="p : ${publicaciones}" class="tarjeta caja">
            <div class="imagen" th:if="${p.imagen != null}">
                <img th:src="@{/img/comunidad/{s}-800.webp(s=${p.imagen})}"
                     th:attr="srcset=@{/img/comunidad/{s}-800.webp(s=${p.imagen})} + ' 800w, ' + @{/img/comunidad/{s}-1600.webp(s=${p.imagen})} + ' 1600w'"
                     sizes="(min-width: 45rem) 18rem, 100vw" width="800" height="600"
                     loading="lazy" th:alt="#{${'foto.comunidad.' + p.imagen}}">
            </div>
            <div class="texto">
                <h3><a th:href="@{${rutas.COMUNIDAD_PUBLICACION}(id=${p.id})}"
                       th:text="${p.titulo}">Título</a></h3>
                <span th:text="${p.resumen}">Resumen</span>
                <span>
                    <span class="etiqueta" th:text="#{${p.tipo.clave}}">Tipo</span>
                    <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#calendario'"></use></svg><span th:text="${p.fecha}">Fecha</span>
                </span>
            </div>
        </article>
        </div>
    </div>
    <section class="recicladores">
        <h2 th:text="#{comunidad.recicladores}">Recicladores independientes</h2>
        <p th:text="#{comunidad.recicladores.ayuda}">Ayuda</p>
        <p class="caja banner" role="note" th:if="${demoHabilitada and !recicladores.isEmpty()}"
           th:text="#{comunidad.recicladores.demo}">Datos de prueba</p>
        <p th:if="${recicladores.isEmpty()}"
           th:text="#{comunidad.recicladores.vacia}">Vacío</p>
        <ul class="rejilla">
            <li th:each="r : ${recicladores}" class="reciclador"
                th:with="partes=${#strings.arraySplit(r.nombre, ' ')}">
                <span class="iniciales" aria-hidden="true"
                      th:text="${#strings.substring(partes[0], 0, 1) + #strings.substring(partes[partes.length - 1], 0, 1)}">AC</span>
                <span class="texto">
                    <strong th:text="${r.nombre}">Nombre</strong>
                    <span th:if="${r.ciudad != null}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#pin'"></use></svg><span th:text="#{${r.ciudad.clave}}">Ciudad</span></span>
                    <a th:if="${r.telefono != null}"
                       th:href="'tel:' + ${#strings.replace(r.telefono, ' ', '')}"
                       ><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#telefono'"></use></svg><span th:text="${r.telefono}">Teléfono</span></a>
                    <span th:unless="${r.telefono != null}" class="sin-telefono" th:text="#{comunidad.recicladores.sin.telefono}">Sin teléfono</span>
                </span>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
