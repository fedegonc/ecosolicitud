<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{cuenta.perfil.titulo}">Mi perfil</title>
</head>
<body>
<main layout:fragment="content" hx-boost="false">
    <h1 th:text="#{cuenta.perfil.titulo}">Mi perfil</h1>
    <p th:text="#{cuenta.perfil.intro}">Estos son los datos de tu cuenta de vecino.</p>
    <p class="mensaje mensaje--confirmacion" role="status" th:if="${guardado}"
       th:text="#{cuenta.perfil.guardado}">Los datos de tu cuenta quedaron guardados.</p>
    <form th:action="@{${rutas.CUENTA_PERFIL}}" method="post">
        <div class="resumen-errores" role="alert" tabindex="-1" th:if="${!errores.isEmpty()}">
            <p th:text="#{perfil.resumen.titulo}">Revisá estos datos antes de guardar</p>
            <ul>
                <li th:each="e : ${errores.values()}" th:text="#{${e}}">Error</li>
            </ul>
        </div>
        <label class="campo" th:classappend="${errores.containsKey('nombre')} ? 'invalido'">
            <span th:text="#{cuenta.perfil.nombre}">Nombre de usuario</span>
            <input type="text" name="nombre" th:value="${valores.nombre}" autocomplete="username">
        </label>
        <label class="campo" th:classappend="${errores.containsKey('pais')} ? 'invalido'">
            <span th:text="#{cuenta.pais}">País</span>
            <select name="pais" required>
                <option value="UY" th:selected="${paisActual == 'UY'}">Uruguay</option>
                <option value="BR" th:selected="${paisActual == 'BR'}">Brasil</option>
            </select>
        </label>
        <label class="campo" th:classappend="${errores.containsKey('telefono')} ? 'invalido'">
            <span th:text="#{perfil.telefono}">Teléfono</span>
            <input type="tel" name="telefono" th:value="${valores.telefono}"
                   autocomplete="tel" th:aria-describedby="ayuda-tel">
            <small id="ayuda-tel" class="ayuda" th:text="#{perfil.telefono.ayuda}">Con código de país</small>
        </label>
        <label class="campo" th:classappend="${errores.containsKey('clave')} ? 'invalido'">
            <span th:text="#{cuenta.perfil.clave}">Contraseña nueva (opcional)</span>
            <input type="password" name="clave" autocomplete="new-password"
                   th:aria-describedby="ayuda-clave">
            <small id="ayuda-clave" class="ayuda" th:text="#{cuenta.perfil.clave.ayuda}">Dejalo vacío para conservar la actual.</small>
        </label>
        <button type="submit" th:text="#{cuenta.perfil.guardar}">Guardar cambios</button>
    </form>
    <script th:if="${!errores.isEmpty()}">document.querySelector('.resumen-errores').focus();</script>
</main>
</body>
</html>
