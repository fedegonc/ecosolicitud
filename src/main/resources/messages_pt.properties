cuenta.condiciones.texto=EcoSolicitud é um projeto acadêmico. Os dados inseridos são usados apenas para demonstração e melhoria do serviço. Ao se registrar, você aceita que as informações das suas solicitações (nome, celular e endereço) sejam visíveis para o centro que as gerencia. O uso comercial está fora do escopo do projeto e ambas as partes devem respeitar a legislação vigente no Uruguai e no Brasil. O serviço é oferecido como está, sem garantias.
