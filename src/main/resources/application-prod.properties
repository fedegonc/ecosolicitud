server.address=0.0.0.0
spring.thymeleaf.cache=true
spring.messages.cache-duration=-1s

# Postgres (Supabase) via env vars, sin fallback: si falta DATABASE_URL el
# boot falla en vez de arrancar silencioso contra otra base. Pooler session
# mode puerto 5432:
# DATABASE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
# DATABASE_USER=postgres.<project-ref>
# DATABASE_PASSWORD=<contraseña de la base, no la publishable key>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Access log a stdout: Render solo captura stdout y en plan free no hay
# request logs de plataforma; sin esto un flood no deja evidencia.
# rotatable=false + directory=/dev + prefix=stdout escribe en /dev/stdout.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i %r %s %b %{ms}Tms "%{User-Agent}i"

# El reinicio del dataset borra datos. Ademas del flag, SeguridadConfig
# bloquea siempre su endpoint web, incluso para el administrador.
ecosolicitud.demo.reiniciar=false

spring.web.resources.cache.period=7d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**

# Tras el proxy de Render la IP real del cliente llega en X-Forwarded-For;
# sin esto getRemoteAddr() devuelve la IP del proxy y el rate-limit de login
# agruparia a todos los usuarios en una sola cuota de 5/min.
server.forward-headers-strategy=framework
