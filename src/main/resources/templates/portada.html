<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{app.nombre}">EcoSolicitud</title>
</head>
<body>
<main layout:fragment="content" class="ds">
    <div th:replace="~{componentes/ds :: saludo(${pagina})}"></div>
    <header id="ds-titulo" class="intro">
        <h1 th:text="#{${pagina.titulo}(${pagina.localidad.nombre})}">Reciclar en Rivera</h1>
        <p th:text="#{${pagina.subtitulo}(${pagina.localidad.nombre})}"></p>
        <p><a th:href="@{${rutas.AYUDA}}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#ayuda'"></use></svg><span th:text="#{ayuda.primera}">¿Primera vez? Mirá cómo se usa</span></a></p>
    </header>
    <nav id="ds-acciones" class="acciones" th:aria-label="#{ds.acciones}">
        <th:block th:each="a : ${pagina.acciones}">
            <a th:replace="~{componentes/ds :: accion(${a.icono}, ${a.clave}, ${a.enlace})}"></a>
        </th:block>
    </nav>
    <th:block th:if="${rolActual.name() == 'CIUDADANO'}">
        <a th:replace="~{componentes/ds :: ultimo(${ultimo})}"></a>
    </th:block>
    <section id="ds-pasos" class="pasos-como">
        <h2 th:text="#{portada.pasos.titulo}">Así funciona</h2>
        <ol>
            <li><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#lapiz'"></use></svg>
                <span><strong th:text="#{portada.paso1}">Pedís el retiro</strong>
                <span class="paso-detalle" th:text="#{portada.paso1.detalle}">Desde el celular, sin llamadas.</span></span></li>
            <li><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#tilde'"></use></svg>
                <span><strong th:text="#{portada.paso2}">El centro confirma</strong>
                <span class="paso-detalle" th:text="#{portada.paso2.detalle}">Te avisa cuando lo acepta.</span></span></li>
            <li><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#camion'"></use></svg>
                <span><strong th:text="#{portada.paso3}">Pasan a buscarlo</strong>
                <span class="paso-detalle" th:text="#{portada.paso3.detalle}">Lo dejás listo en tu puerta.</span></span></li>
        </ol>
    </section>
    <section id="ds-consejos">
        <div th:replace="~{componentes/ds :: cabecera(#{ds.consejos}, ${rutas.GUIA})}"></div>
        <div class="grilla">
            <th:block th:each="t : ${pagina.consejos}">
                <a th:replace="~{componentes/ds :: tarjeta(${t.clave}, ${t.imagen}, ${t.enlace})}"></a>
            </th:block>
        </div>
    </section>
    <section id="ds-centros">
        <div th:replace="~{componentes/ds :: cabecera(#{seccion.acopios}, ${rutas.ACOPIOS})}"></div>
        <ul class="grilla">
            <li class="tarjeta caja" th:each="c : ${centros}">
                <a th:href="@{${rutas.ACOPIOS}}">
                    <span class="fila-acento">
                        <span class="circulo-suave" aria-hidden="true"><svg class="icono"><use th:href="@{/img/iconos.svg} + '#pin'"></use></svg></span>
                        <span class="fila-texto">
                            <strong th:text="${c.nombre}">Centro</strong>
                            <span class="tarjeta-detalle" th:text="${c.horario}">Horario</span>
                        </span>
                        <svg class="icono flecha" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg>
                    </span>
                    <span class="tarjeta-chips" th:if="${!#lists.isEmpty(c.materiales)}">
                        <span th:each="m : ${c.materiales}"
                              th:class="'etiqueta-material mat-' + ${#strings.toLowerCase(m.codigo)}"
                              th:text="${#messages.msgOrNull('material.' + #strings.toLowerCase(m.codigo)) ?: m.nombre}">Material</span>
                    </span>
                    <iframe class="mapa-mini" th:if="${c.ubicacion != null}"
                            th:src="${c.ubicacion.mapaEmbebido()}"
                            th:title="#{mapa.de(${c.nombre})}" loading="lazy"></iframe>
                </a>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
