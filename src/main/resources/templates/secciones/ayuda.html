<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.ayuda}">Cómo se usa</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{ayuda.titulo}">¿Cómo se usa?</h1>
    <p th:text="${rolActual.name() == 'ORGANIZACION'} ? #{ayuda.intro.org} : #{ayuda.intro.ciudadano}">Intro</p>
    <ol class="pasos">
        <li th:each="p, i : ${pasos}">
            <img th:src="@{/img/ayuda/{s}-800.webp(s=${p.imagen})}"
                 th:attr="srcset=@{/img/ayuda/{s}-800.webp(s=${p.imagen})} + ' 800w, ' + @{/img/ayuda/{s}-1600.webp(s=${p.imagen})} + ' 1600w', loading=${i.first} ? 'eager' : 'lazy'"
                 sizes="(min-width: 45rem) 28rem, 100vw" width="800" height="600"
                 th:alt="#{${'ayuda.' + p.imagen + '.alt'}}">
            <div class="texto">
                <h2><span class="numero" th:text="${i.count}">1</span><span th:text="#{${'ayuda.' + p.imagen + '.titulo'}}">Paso</span></h2>
                <p th:text="#{${'ayuda.' + p.imagen + '.texto'}}">Texto</p>
                <a th:href="@{${p.enlace}}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg><span th:text="#{ayuda.ir}">Ir a esta pantalla</span></a>
            </div>
        </li>
    </ol>
    <p th:text="#{ayuda.cierre}">Cierre</p>
</main>
</body>
</html>
