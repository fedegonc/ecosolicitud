ayuda.ciudadano-seguir.titulo=Acompanhe sua solicitação
ayuda.ciudadano-seguir.texto=Em Minhas solicitações você vê o estado de cada uma: pendente, aceita, concluída, recusada ou cancelada. Enquanto estiver pendente, você pode cancelá-la.
