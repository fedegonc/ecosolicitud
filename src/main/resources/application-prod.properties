server.address=0.0.0.0
spring.thymeleaf.cache=true
spring.messages.cache-duration=-1s

# El default son 200 threads y cada stack nativo reserva ~1 MB: ~200 MB
# comprometidos aunque no entren pedidos. En 0,1 CPU (Render free) 50
# concurrentes ya exceden lo que la CPU puede atender, sobra margen.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Postgres (Supabase) via env vars, sin fallback: si falta DATABASE_URL el
# boot falla en vez de arrancar silencioso contra otra base. Pooler session
# mode puerto 5432:
# DATABASE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
# DATABASE_USER=postgres.<project-ref>
# DATABASE_PASSWORD=<contraseña de la base, no la publishable key>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Registros: solo lo importante (ERROR y WARN), más dos INFO a propósito:
# la línea de arranque ("Started ... in N seconds") y los tiempos de
# /estadisticas, /mis-solicitudes y /avisos. TiemposFiltro además deja un
# WARN por cualquier pedido lento (>= 1 s) o 5xx, y ModoIntentosFiltro uno
# por cada bloqueo de ingreso. Nada lleva IP, query, User-Agent ni usuario.
# El access log de Tomcat queda apagado: registraba todo eso, una línea por
# pedido. Render ya pone la hora: el formato es nivel, logger y mensaje.
logging.level.root=WARN
logging.level.com.ecosolicitud.EcoSolicitudApplication=INFO
logging.level.ecosolicitud.tiempos=INFO
logging.pattern.console=%-5level %logger{0} %msg%n
logging.exception-conversion-word=%ex{12}
spring.main.banner-mode=off
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.tomcat.accesslog.enabled=false

# El reinicio del dataset borra datos. Ademas del flag, SeguridadConfig
# bloquea siempre su endpoint web, incluso para el administrador.
ecosolicitud.demo.reiniciar=false

spring.web.resources.cache.period=7d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**

# Tras el proxy de Render la IP real del cliente llega en X-Forwarded-For;
# sin esto getRemoteAddr() devuelve la IP del proxy y el rate-limit de login
# agruparia a todos los usuarios en una sola cuota de 5/min.
server.forward-headers-strategy=framework

# La cookie de sesión sale siempre por HTTPS detrás del proxy de Render.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
