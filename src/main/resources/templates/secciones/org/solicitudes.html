<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{org.solicitudes.titulo}">Solicitudes recibidas</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{org.solicitudes.titulo}">Solicitudes recibidas</h1>
    <p class="caja banner" th:text="#{org.bienvenida(${organizacion.nombre})}">Hola</p>
    <p th:text="#{org.bienvenida.detalle}">Panel</p>
    <p th:text="#{org.semana(${semana.recibidas}, ${semana.aceptadas}, ${semana.completadas}, ${semana.mediana()})}">Semana</p>
    <div id="bandeja" th:fragment="bandeja">
        <p class="caja banner" role="status" th:if="${avisoCodigo}" th:text="#{${avisoCodigo}(${avisoId})}">Aviso</p>
        <p class="caja banner alerta" role="alert" th:if="${alertaCodigo}" th:text="#{${alertaCodigo}(${alertaId})}">Alerta</p>
        <div class="kanban">
        <section class="kanban-col" th:each="g : ${bandeja.grupos}"
                 th:attr="aria-label=#{${g.clave}}">
            <h2 th:text="#{${g.clave}}">Grupo</h2>
            <p th:if="${g.solicitudes.isEmpty()}" th:text="#{org.vacia}">Vacío</p>
            <div class="rejilla">
            <article th:each="s : ${g.solicitudes}" class="tarjeta caja">
                <div class="texto">
                    <th:block th:replace="~{secciones/ficha :: cuerpo(${s}, ${s.nombreCiudadano}, @{${rutas.ORG_SOLICITUD}(id=${s.id})})}"></th:block>
                </div>
                <div class="fila" th:if="${!s.estado.esFinal()}">
                    <form th:if="${s.estado.permiteAceptar()}"
                          th:action="@{${rutas.ORG_ACEPTAR}(id=${s.id})}" method="post" hx-indicator="this"
                          hx-target="#bandeja" hx-select="#bandeja" hx-swap="outerHTML">
                        <input type="hidden" name="version" th:value="${s.version}">
                        <button type="submit"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#tilde'"></use></svg><span th:text="#{accion.aceptar}">Aceptar</span></button>
                    </form>
                    <form th:if="${s.estado.permiteRechazar()}"
                          th:action="@{${rutas.ORG_RECHAZAR}(id=${s.id})}" method="post" hx-indicator="this"
                          hx-target="#bandeja" hx-select="#bandeja" hx-swap="outerHTML">
                        <input type="hidden" name="version" th:value="${s.version}">
                        <button type="submit" class="peligro"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#cruz'"></use></svg><span th:text="#{accion.rechazar}">Rechazar</span></button>
                    </form>
                    <form th:if="${s.estado.permiteCompletar()}"
                          th:action="@{${rutas.ORG_COMPLETAR}(id=${s.id})}" method="post" hx-indicator="this"
                          hx-target="#bandeja" hx-select="#bandeja" hx-swap="outerHTML">
                        <input type="hidden" name="version" th:value="${s.version}">
                        <button type="submit"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#tilde'"></use></svg><span th:text="#{accion.completar}">Completar</span></button>
                    </form>
                </div>
            </article>
            </div>
            <p th:if="${g.solicitudes.size() < g.total}"
               th:text="#{org.grupo.mostrando(${g.solicitudes.size()}, ${g.total})}">Mostrando 20 de 45</p>
        </section>
        </div>
    </div>
    <footer class="fila">
        <a th:href="@{${rutas.ORG_ARCHIVADAS}}"
           th:text="#{org.archivadas(${archivadas})}">Archivo</a>
        <a th:href="@{${rutas.ORG_INFORME}}"
           th:text="#{panel.informe}">Informe mensual</a>
    </footer>
</main>
</body>
</html>
