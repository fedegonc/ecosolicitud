<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{org.solicitudes.titulo}">Solicitudes recibidas</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{org.solicitudes.titulo}">Solicitudes recibidas</h1>
    <p class="aviso" role="status" th:if="${avisoCodigo}" th:text="#{${avisoCodigo}(${avisoId})}">Aviso</p>
    <p class="alerta" role="alert" th:if="${alertaCodigo}" th:text="#{${alertaCodigo}(${alertaId})}">Alerta</p>
    <section th:each="g : ${bandeja.grupos}">
        <h2 th:text="#{${g.clave}}">Grupo</h2>
        <p class="detalle" th:if="${g.solicitudes.isEmpty()}" th:text="#{org.vacia}">Vacío</p>
        <div class="rejilla">
        <article th:each="s : ${g.solicitudes}" class="tarjeta">
            <th:block th:replace="~{secciones/ficha :: cuerpo(${s}, ${s.nombreCiudadano})}"></th:block>
            <div class="acciones" th:if="${!s.estado.esFinal()}">
                <form th:if="${s.estado.permiteAceptar()}"
                      th:action="@{/org/solicitudes/{id}/aceptar(id=${s.id})}" method="post">
                    <input type="hidden" name="version" th:value="${s.version}">
                    <button type="submit" class="accion"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#tilde'"></use></svg><span th:text="#{accion.aceptar}">Aceptar</span></button>
                </form>
                <form th:if="${s.estado.permiteRechazar()}"
                      th:action="@{/org/solicitudes/{id}/rechazar(id=${s.id})}" method="post">
                    <input type="hidden" name="version" th:value="${s.version}">
                    <button type="submit" class="accion peligro"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#cruz'"></use></svg><span th:text="#{accion.rechazar}">Rechazar</span></button>
                </form>
                <form th:if="${s.estado.permiteCompletar()}"
                      th:action="@{/org/solicitudes/{id}/completar(id=${s.id})}" method="post">
                    <input type="hidden" name="version" th:value="${s.version}">
                    <button type="submit" class="accion"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#tilde'"></use></svg><span th:text="#{accion.completar}">Completar</span></button>
                </form>
            </div>
        </article>
        </div>
    </section>
</main>
</body>
</html>
