name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reglas de arquitectura
        run: bash .github/scripts/arquitectura.sh
      - name: Verify
        run: mvn -B verify
      - name: El jar de producción no lleva mecanismos de desarrollo
        run: |
          if unzip -l target/ecosolicitud-*.jar | grep -iE 'devtools|jacoco|allure|junit|mockito|selenium|htmlunit'; then
            echo "::error::El jar de producción contiene artefactos de desarrollo"
            exit 1
          fi
          echo "Jar limpio: sin devtools, jacoco, allure ni frameworks de test"
