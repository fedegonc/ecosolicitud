server.address=0.0.0.0
# sin la seguridad por defecto de Boot: en la ventana del hot reload
# respondía 401 Basic (diálogo de usuario/clave) antes de cargar SeguridadConfig
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:h2:file:./data/ecosolicitud
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
# tema alternativo de la interfaz: vacío = el de la casa
# ecosolicitud.tema=clasico
spring.messages.cache-duration=0
