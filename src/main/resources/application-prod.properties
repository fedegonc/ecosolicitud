server.address=0.0.0.0
spring.thymeleaf.cache=true

# Temporal: H2 en archivo hasta configurar Supabase.
spring.datasource.url=jdbc:h2:file:./data/ecosolicitud
spring.datasource.username=sa
spring.datasource.password=

# Supabase (Postgres): descomentar cuando Render tenga las env vars
# DATABASE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
# DATABASE_USER=postgres.<project-ref>
# DATABASE_PASSWORD=<contraseña de la base, no la publishable key>
# y el driver postgres habilitado en pom.xml.
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USER}
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.web.resources.cache.period=7d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**
