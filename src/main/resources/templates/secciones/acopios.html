<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.acopios}">Centros de acopio</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.acopios}">Centros de acopio</h1>
    <p class="caja banner" th:if="${demoHabilitada}" th:text="#{acopios.demo}">Centros de ejemplo</p>
    <section th:each="g : ${grupos}" th:with="foto=${#strings.toLowerCase(g.ciudad.name())}">
        <h2 th:text="#{${g.ciudad.clave}}">Ciudad</h2>
        <div class="rejilla">
            <article th:each="o : ${g.organizaciones}" class="tarjeta caja">
                <div class="texto">
                    <h3 th:text="${o.nombre}">Nombre</h3>
                    <dl>
                        <dt><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#reloj'"></use></svg></dt>
                        <dd><span th:text="${o.horario}">Horario</span></dd>
                    </dl>
                    <dl>
                        <dt><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#telefono'"></use></svg></dt>
                        <dd><a th:href="'tel:' + ${#strings.replace(o.telefono, ' ', '')}"
                               th:text="${o.telefono}">Teléfono</a></dd>
                    </dl>
                    <ul class="materiales">
                        <li th:each="m : ${o.materiales}" th:class="'etiqueta-material ' + 'mat-' + ${#strings.toLowerCase(m.codigo)}">
                            <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${m.icono}"></use></svg>
                            <span th:text="${#messages.msgOrNull('material.' + #strings.toLowerCase(m.codigo)) ?: m.nombre}">Material</span>
                        </li>
                    </ul>
                    <th:block th:if="${o.ubicacion != null}">
                        <iframe class="mapa-centro" th:src="${o.ubicacion.mapaEmbebido()}"
                                th:title="#{acopios.mapa(${o.nombre})}" loading="lazy"></iframe>
                        <a th:href="${o.ubicacion.enlaceMapa()}" target="_blank" rel="noopener"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#pin'"></use></svg><span th:text="#{acopios.mapa.ver}">Ver en el mapa</span></a>
                    </th:block>
                </div>
                <div class="fila">
                    <a class="caja"
                       th:href="@{${rutas.NUEVA}(ciudad=${o.ciudad},organizacionId=${o.id})}"
                       ><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg><span th:text="#{acopios.pedir}">Pedir retiro</span></a>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
