<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.avisos}">Avisos</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{avisos.titulo}">Avisos</h1>
    <p th:if="${avisos.isEmpty()}" th:text="#{${'avisos.vacia.' + #strings.toLowerCase(rolActual.name())}}">Vacía</p>

    <!-- ciudadano: timeline con el estado actual de cada pedido -->
    <ol class="timeline" th:if="${rolActual.name() == 'CIUDADANO' and !avisos.isEmpty()}">
        <li th:each="a : ${avisos}" th:classappend="('est-' + ${#strings.toLowerCase(a.estado().name())}) + (${!a.leida()} ? ' nueva' : '')">
            <a class="aviso-id" th:if="${a.solicitudId() != null}"
               th:href="@{${rutas.MIS_SOLICITUD}(id=${a.solicitudId()})}"
               th:text="'#' + ${a.solicitudId()}">#3</a>
            <span class="etiqueta" th:classappend="'est-' + ${#strings.toLowerCase(a.estado().name())}" th:title="#{${a.estado().ayuda}}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${a.estado().icono}"></use></svg>
            <span th:text="#{${a.estado().clave}}">Estado</span></span>
            <p class="aviso-texto" th:text="#{${a.tipo().clave}(${a.detalle()}, ${a.solicitudId() != null ? a.solicitudId().toString() : ''})}">Texto</p>
            <span class="detalle"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#calendario'"></use></svg><span
                  th:text="${#temporals.format(a.creadaEn(), 'dd/MM HH:mm')}">fecha</span></span>
        </li>
    </ol>

    <!-- organización: kanban por dónde está el pedido ahora -->
    <div class="kanban" th:if="${rolActual.name() == 'ORGANIZACION' and !avisos.isEmpty()}">
        <section class="kanban-col" th:each="c : ${columnas}">
            <h2><span th:text="#{${c.clave()}}">Columna</span> <span class="kanban-cant" th:text="${c.avisos().size()}">0</span></h2>
            <article class="tarjeta caja" th:each="a : ${c.avisos()}"
                     th:classappend="('est-' + ${#strings.toLowerCase(a.estado().name())}) + (${!a.leida()} ? ' nueva' : '')">
                <div class="texto">
                    <a class="aviso-id" th:if="${a.solicitudId() != null}"
                       th:href="@{${rutas.ORG_SOLICITUD}(id=${a.solicitudId()})}"
                       th:text="'#' + ${a.solicitudId()}">#3</a>
                    <p class="aviso-texto" th:text="#{${a.tipo().clave}(${a.detalle()}, ${a.solicitudId() != null ? a.solicitudId().toString() : ''})}">Texto</p>
                    <dl><dt><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#calendario'"></use></svg></dt><dd
                          th:text="${#temporals.format(a.creadaEn(), 'dd/MM HH:mm')}">fecha</dd></dl>
                </div>
            </article>
        </section>
    </div>
</main>
</body>
</html>
