<!DOCTYPE html>
<html lang="es" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.nueva}">Nueva solicitud</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.nueva}">Nueva solicitud</h1>
    <form th:action="@{/nueva}" method="post" th:object="${form}" class="ficha">
        <label class="campo">
            <span th:text="#{nueva.ciudad}">Ciudad</span>
            <select th:field="*{ciudad}" required th:attr="hx-get=@{/nueva}"
                    hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                    hx-include="closest form" hx-params="not _csrf">
                <option value="" th:text="#{nueva.ciudad.elegir}">Elegí una ciudad</option>
                <option th:each="c : ${ciudades}" th:value="${c}" th:text="#{${c.clave}}">Ciudad</option>
            </select>
            <span class="ayuda" th:text="#{nueva.ciudad.ayuda}">Ayuda</span>
            <span class="error" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}">Error</span>
        </label>

        <div id="flujo" aria-live="polite">
            <!-- ya elegido (desde el centro o por la lista): resumen, no otra elección -->
            <div class="campo" th:if="${centro != null}">
                <span th:text="#{nueva.centro}">Centro de acopio</span>
                <p class="centro-resumen">
                    <span>
                        <strong th:text="${centro.nombre}">Nombre</strong>
                        <span class="detalle" th:text="${centro.horario}">Horario</span>
                    </span>
                    <a class="enlace" th:href="@{/nueva(ciudad=${form.ciudad})}"
                       th:attr="hx-get=@{/nueva}"
                       hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                       hx-include="closest form" hx-params="not _csrf,organizacionId"
                       th:text="#{nueva.centro.cambiar}">Cambiar</a>
                </p>
                <input type="hidden" th:field="*{organizacionId}">
                <p class="error" th:if="${#fields.hasErrors('organizacionId')}"
                   th:errors="*{organizacionId}">Error</p>
            </div>

            <fieldset class="campo" th:if="${centro == null and !#lists.isEmpty(centros)}">
                <legend th:text="#{nueva.centro}">Centro de acopio</legend>
                <label th:each="o : ${centros}" class="opcion-centro">
                    <input type="radio" th:field="*{organizacionId}" th:value="${o.id}"
                           th:attr="hx-get=@{/nueva}"
                           hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                           hx-include="closest form" hx-params="not _csrf">
                    <span>
                        <strong th:text="${o.nombre}">Nombre</strong>
                        <span class="detalle" th:text="${o.horario}">Horario</span>
                    </span>
                </label>
                <span class="ayuda" th:text="#{nueva.centro.ayuda}">Ayuda</span>
                <p class="error" th:if="${#fields.hasErrors('organizacionId')}"
                   th:errors="*{organizacionId}">Error</p>
            </fieldset>

            <p class="alerta" th:if="${form.ciudad != null and #lists.isEmpty(centros)}"
               th:text="#{nueva.sin.centros}">Sin centros</p>

            <fieldset class="campo" th:if="${centro != null}">
                <legend th:text="#{nueva.materiales.del.centro(${centro.nombre})}">Materiales</legend>
                <label th:each="m : ${materialesCentro}" class="opcion-material">
                    <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${m.icono}"></use></svg>
                    <input type="checkbox" name="materiales" th:value="${m}"
                           th:checked="${form.materiales.contains(m)}">
                    <span th:class="'etiqueta-material ' + 'mat-' + ${#strings.toLowerCase(m.name())}"
                          th:text="#{${m.clave}}">Material</span>
                </label>
                <span class="ayuda" th:text="#{nueva.materiales.ayuda}">Ayuda</span>
                <p class="error" th:if="${#fields.hasErrors('materiales')}"
                   th:errors="*{materiales}">Error</p>
            </fieldset>

            <fieldset class="campo" th:if="${centro != null}">
                <legend th:text="#{nueva.grupo.contacto}">Contacto</legend>
                <label class="campo">
                    <span th:text="#{nueva.nombre}">Nombre</span>
                    <input type="text" th:field="*{nombre}" required maxlength="80"
                           autocomplete="name" th:placeholder="#{nueva.nombre.ejemplo}">
                    <span class="error" th:if="${#fields.hasErrors('nombre')}"
                          th:errors="*{nombre}">Error</span>
                </label>
                <label class="campo">
                    <span th:text="#{nueva.contacto}">Celular o contacto</span>
                    <input type="tel" th:field="*{contacto}" required maxlength="40"
                           autocomplete="tel" th:placeholder="#{nueva.contacto.ejemplo}">
                    <span class="ayuda" th:text="#{nueva.contacto.ayuda}">Ayuda</span>
                    <span class="error" th:if="${#fields.hasErrors('contacto')}"
                          th:errors="*{contacto}">Error</span>
                </label>
            </fieldset>

            <fieldset class="campo bloque-ubicacion" th:if="${centro != null}">
                <legend th:text="#{nueva.grupo.ubicacion}">Ubicación</legend>
                <label class="campo">
                    <span th:text="#{nueva.direccion}">Dirección</span>
                    <input type="text" th:field="*{direccion}" required maxlength="120"
                           autocomplete="street-address">
                    <span class="error" th:if="${#fields.hasErrors('direccion')}"
                          th:errors="*{direccion}">Error</span>
                </label>
                <label class="campo">
                    <span th:text="#{nueva.referencia}">Referencia</span>
                    <input type="text" th:field="*{referencia}" maxlength="120">
                    <span class="error" th:if="${#fields.hasErrors('referencia')}"
                          th:errors="*{referencia}">Error</span>
                </label>
                <label class="campo">
                    <span th:text="#{nueva.nota}">Nota</span>
                    <textarea th:field="*{nota}" rows="3" maxlength="300"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}">Error</span>
                </label>
                <button type="submit" class="accion"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#enviar'"></use></svg><span th:text="#{nueva.enviar}">Enviar</span></button>
            </fieldset>
        </div>

        <noscript>
            <button type="submit" formmethod="get" class="accion secundaria"
                    th:if="${centro == null}" th:text="#{nueva.continuar}">Continuar</button>
        </noscript>
    </form>
</main>
</body>
</html>
