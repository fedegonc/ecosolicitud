<!DOCTYPE html>
<html lang="es" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.nueva}">Nueva solicitud</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.nueva}">Nueva solicitud</h1>
    <header class="panel-cabecera">
        <img class="franja" th:src="@{/img/ciudad/franja-1600.webp}"
             th:attr="srcset=@{/img/ciudad/franja-800.webp} + ' 800w, ' + @{/img/ciudad/franja-1600.webp} + ' 1600w'"
             sizes="100vw" width="1600" height="250" alt="">
        <p class="bienvenida" th:text="#{nueva.intro}">Pedí el retiro en cuatro pasos</p>
        <p th:text="#{nueva.intro.detalle}">Ciudad, centro, materiales y tus datos.</p>
    </header>
    <form th:action="@{/nueva}" method="post" th:object="${form}" class="ficha" hx-indicator="this">
        <label class="campo">
            <span th:text="#{nueva.ciudad}">Ciudad</span>
            <select th:field="*{ciudad}" required th:attr="hx-get=@{/nueva}"
                    hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                    hx-include="closest form" hx-params="not _csrf" hx-indicator="#flujo">
                <option value="" th:text="#{nueva.ciudad.elegir}">Elegí una ciudad</option>
                <option th:each="c : ${ciudades}" th:value="${c}" th:text="#{${c.clave}}">Ciudad</option>
            </select>
            <span class="ayuda" th:text="#{nueva.ciudad.ayuda}">Ayuda</span>
            <span class="error" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}">Error</span>
        </label>

        <div id="flujo" class="flujo" aria-live="polite">
            <!-- ya elegido (desde el centro o por la lista): resumen, no otra elección -->
            <div class="campo" th:if="${centro != null}">
                <span th:text="#{nueva.centro}">Centro de acopio</span>
                <p class="centro-resumen">
                    <span>
                        <strong th:text="${centro.nombre}">Nombre</strong>
                        <span class="detalle" th:text="${centro.horario}">Horario</span>
                    </span>
                    <a class="enlace" th:href="@{/nueva(ciudad=${form.ciudad})}"
                       th:attr="hx-get=@{/nueva}"
                       hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                       hx-include="closest form" hx-params="not _csrf,organizacionId"
                       hx-indicator="#flujo"
                       th:text="#{nueva.centro.cambiar}">Cambiar</a>
                </p>
                <input type="hidden" th:field="*{organizacionId}">
                <p class="error" th:if="${#fields.hasErrors('organizacionId')}"
                   th:errors="*{organizacionId}">Error</p>
            </div>

            <fieldset class="campo" th:if="${centro == null and !#lists.isEmpty(centros)}">
                <legend th:text="#{nueva.centro}">Centro de acopio</legend>
                <label th:each="o : ${centros}" class="opcion-centro">
                    <input type="radio" th:field="*{organizacionId}" th:value="${o.id}"
                           th:attr="hx-get=@{/nueva}"
                           hx-target="#flujo" hx-select="#flujo" hx-replace-url="true"
                           hx-include="closest form" hx-params="not _csrf" hx-indicator="#flujo">
                    <span>
                        <strong th:text="${o.nombre}">Nombre</strong>
                        <span class="detalle" th:text="${o.horario}">Horario</span>
                    </span>
                </label>
                <span class="ayuda" th:text="#{nueva.centro.ayuda}">Ayuda</span>
                <p class="error" th:if="${#fields.hasErrors('organizacionId')}"
                   th:errors="*{organizacionId}">Error</p>
            </fieldset>

            <p class="alerta" th:if="${form.ciudad != null and #lists.isEmpty(centros)}"
               th:text="#{nueva.sin.centros}">Sin centros</p>

            <fieldset class="campo" th:if="${centro != null}">
                <legend th:text="#{nueva.materiales.del.centro(${centro.nombre})}">Materiales</legend>
                <label th:each="m : ${materialesCentro}" class="opcion-material">
                    <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${m.icono}"></use></svg>
                    <input type="checkbox" name="materiales" th:value="${m.codigo}"
                           th:checked="${form.materiales.contains(m)}">
                    <span th:class="'etiqueta-material ' + 'mat-' + ${#strings.toLowerCase(m.codigo)}"
                          th:text="${m.nombre}">Material</span>
                </label>
                <span class="ayuda" th:text="#{nueva.materiales.ayuda}">Ayuda</span>
                <p class="error" th:if="${#fields.hasErrors('materiales')}"
                   th:errors="*{materiales}">Error</p>
            </fieldset>

            <fieldset class="campo" th:if="${centro != null}">
                <legend th:text="#{nueva.grupo.contacto}">Contacto</legend>
                <p class="aviso" role="note" th:text="#{nueva.datos.prueba}">Usá datos de prueba</p>
                <label class="campo"
                       hx-on::after-swap="this.querySelector('input,textarea').setAttribute('aria-invalid', this.querySelector('.error').textContent.trim() !== '')">
                    <span><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#persona'"></use></svg><span th:text="#{nueva.nombre}">Nombre</span></span>
                    <input type="text" th:field="*{nombre}" required maxlength="80"
                           autocomplete="name" th:placeholder="#{nueva.nombre.ejemplo}"
                           aria-describedby="err-nombre"
                           th:attr="hx-post=@{/nueva/validar(campo='nombre')},aria-invalid=${#fields.hasErrors('nombre')}"
                           hx-trigger="blur" hx-target="next .error" hx-swap="innerHTML"
                           hx-include="closest form">
                    <span class="error" id="err-nombre" role="alert"><span th:errors="*{nombre}"></span></span>
                </label>
                <label class="campo"
                       hx-on::after-swap="this.querySelector('input,textarea').setAttribute('aria-invalid', this.querySelector('.error').textContent.trim() !== '')">
                    <span><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#telefono'"></use></svg><span th:text="#{nueva.contacto}">Celular o contacto</span></span>
                    <input type="tel" th:field="*{contacto}" required maxlength="40"
                           inputmode="tel" autocomplete="tel" th:placeholder="#{nueva.contacto.ejemplo}"
                           aria-describedby="ayuda-contacto err-contacto"
                           th:attr="hx-post=@{/nueva/validar(campo='contacto')},aria-invalid=${#fields.hasErrors('contacto')}"
                           hx-trigger="blur" hx-target="next .error" hx-swap="innerHTML"
                           hx-include="closest form">
                    <span class="ayuda" id="ayuda-contacto" th:text="#{nueva.contacto.ayuda}">Ayuda</span>
                    <span class="error" id="err-contacto" role="alert"><span th:errors="*{contacto}"></span></span>
                </label>
            </fieldset>

            <fieldset class="campo bloque-ubicacion" th:if="${centro != null}">
                <legend th:text="#{nueva.grupo.ubicacion}">Ubicación</legend>
                <label class="campo"
                       hx-on::after-swap="this.querySelector('input,textarea').setAttribute('aria-invalid', this.querySelector('.error').textContent.trim() !== '')">
                    <span><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#pin'"></use></svg><span th:text="#{nueva.direccion}">Dirección</span></span>
                    <input type="text" th:field="*{direccion}" required maxlength="120"
                           autocomplete="street-address"
                           aria-describedby="err-direccion"
                           th:attr="hx-post=@{/nueva/validar(campo='direccion')},aria-invalid=${#fields.hasErrors('direccion')}"
                           hx-trigger="blur" hx-target="next .error" hx-swap="innerHTML"
                           hx-include="closest form">
                    <span class="error" id="err-direccion" role="alert"><span th:errors="*{direccion}"></span></span>
                </label>
                <label class="campo"
                       hx-on::after-swap="this.querySelector('input,textarea').setAttribute('aria-invalid', this.querySelector('.error').textContent.trim() !== '')">
                    <span th:text="#{nueva.referencia}">Referencia</span>
                    <input type="text" th:field="*{referencia}" maxlength="120"
                           aria-describedby="err-referencia"
                           th:attr="hx-post=@{/nueva/validar(campo='referencia')},aria-invalid=${#fields.hasErrors('referencia')}"
                           hx-trigger="blur" hx-target="next .error" hx-swap="innerHTML"
                           hx-include="closest form">
                    <span class="error" id="err-referencia" role="alert"><span th:errors="*{referencia}"></span></span>
                </label>
                <div class="campo">
                    <span th:text="#{mapa.titulo}">Ubicación en el mapa</span>
                    <input type="hidden" th:field="*{latitud}">
                    <input type="hidden" th:field="*{longitud}">
                    <div class="mapa-editable" data-mapa-editable role="application" th:aria-label="#{mapa.titulo}"
                         th:attr="data-leaflet-js=@{/js/leaflet/leaflet.js},data-leaflet-css=@{/js/leaflet/leaflet.css}"></div>
                    <p class="mapa-acciones">
                        <button type="button" class="accion secundaria" data-mapa-geolocalizar><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#pin'"></use></svg><span th:text="#{mapa.boton}">Usar mi ubicación</span></button>
                        <button type="button" class="enlace" data-mapa-quitar th:hidden="${form.ubicacion == null}" th:text="#{mapa.quitar}">Quitar ubicación</button>
                    </p>
                    <span class="ayuda" th:text="#{mapa.ayuda}">Ayuda</span>
                    <script th:src="@{/js/mapa.js}"></script>
                    <span class="error" data-mapa-error hidden th:text="#{mapa.error}">Error</span>
                    <span class="error" th:if="${#fields.hasErrors('latitud')}"
                          th:errors="*{latitud}">Error</span>
                </div>
                <label class="campo"
                       hx-on::after-swap="this.querySelector('input,textarea').setAttribute('aria-invalid', this.querySelector('.error').textContent.trim() !== '')">
                    <span><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#lapiz'"></use></svg><span th:text="#{nueva.nota}">Nota</span></span>
                    <textarea th:field="*{nota}" rows="3" maxlength="300"
                              aria-describedby="err-nota"
                              th:attr="hx-post=@{/nueva/validar(campo='nota')},aria-invalid=${#fields.hasErrors('nota')}"
                              hx-trigger="blur" hx-target="next .error" hx-swap="innerHTML"
                              hx-include="closest form"></textarea>
                    <span class="error" id="err-nota" role="alert"><span th:errors="*{nota}"></span></span>
                </label>
                <button type="submit" class="accion"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#enviar'"></use></svg><span th:text="#{nueva.enviar}">Enviar</span></button>
            </fieldset>
        </div>

        <noscript>
            <button type="submit" formmethod="get" class="accion secundaria"
                    th:if="${centro == null}" th:text="#{nueva.continuar}">Continuar</button>
        </noscript>
    </form>
</main>
</body>
</html>
