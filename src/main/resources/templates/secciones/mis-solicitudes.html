<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.mis-solicitudes}">Mis solicitudes</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.mis-solicitudes}">Mis solicitudes</h1>
    <p class="caja banner" th:text="#{mis.bienvenida(${usuario})}">Hola</p>
    <p th:text="#{mis.bienvenida.detalle}">Panel</p>
    <p th:text="#{mis.semana(${semana.recibidas}, ${semana.aceptadas}, ${semana.completadas}, ${semana.mediana()})}">Semana</p>
    <div id="listado">
        <p class="caja banner" role="status" th:if="${enviada}" th:text="#{mis.enviada(${enviada},${enviadaA})}">Aviso</p>
        <p class="caja banner" role="status" th:if="${avisoCodigo}" th:text="#{${avisoCodigo}(${avisoId})}">Aviso</p>
        <p class="caja banner alerta" role="alert" th:if="${alertaCodigo}" th:text="#{${alertaCodigo}(${alertaId})}">Alerta</p>
        <nav class="fila">
            <a class="caja" th:each="f : ${filtros}" th:href="@{${rutas.MIS_SOLICITUDES}(filtro=${#strings.toLowerCase(f.name())})}"
               th:classappend="${f == filtro} ? 'activa'" th:attr="aria-current=${f == filtro} ? 'page' : null"
               hx-target="#listado" hx-select="#listado" hx-swap="outerHTML" hx-push-url="true"
               th:text="#{${'mis.filtro.' + #strings.toLowerCase(f.name())}}">Todas</a>
        </nav>
        <p th:if="${pagina.empty}">
            <span th:text="#{mis.vacia}">No tenés solicitudes.</span>
            <a th:href="@{${rutas.NUEVA}}" th:text="#{mis.nueva}">Nueva solicitud</a>
        </p>
        <div class="rejilla">
        <article th:each="s : ${pagina.content}" class="tarjeta caja">
            <div class="texto">
                <th:block th:replace="~{secciones/ficha :: cuerpo(${s}, ${s.organizacionNombre}, @{${rutas.MIS_SOLICITUD}(id=${s.id})})}"></th:block>
            </div>
            <div class="fila" th:if="${s.estado.permiteCancelar()}">
                <form th:action="@{${rutas.MIS_CANCELAR}(id=${s.id})}" method="post" hx-indicator="this"
                      hx-target="#listado" hx-select="#listado" hx-swap="outerHTML" hx-disabled-elt="find button">
                    <input type="hidden" name="version" th:value="${s.version}">
                    <button type="submit" class="peligro"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#cruz'"></use></svg><span th:text="#{accion.cancelar}">Cancelar</span></button>
                </form>
            </div>
        </article>
        </div>
        <nav class="fila paginacion" th:if="${pagina.totalPages > 1}" th:attr="aria-label=#{paginacion.titulo}">
            <a class="caja" th:if="${pagina.hasPrevious()}"
               th:href="@{${rutas.MIS_SOLICITUDES}(filtro=${#strings.toLowerCase(filtro.name())}, pagina=${pagina.number})}"
               hx-target="#listado" hx-select="#listado" hx-swap="outerHTML" hx-push-url="true"
               th:text="#{paginacion.anterior}">Anterior</a>
            <p th:text="#{paginacion.estado(${pagina.number + 1}, ${pagina.totalPages})}">Página 1 de 3</p>
            <a class="caja" th:if="${pagina.hasNext()}"
               th:href="@{${rutas.MIS_SOLICITUDES}(filtro=${#strings.toLowerCase(filtro.name())}, pagina=${pagina.number + 2})}"
               hx-target="#listado" hx-select="#listado" hx-swap="outerHTML" hx-push-url="true"
               th:text="#{paginacion.siguiente}">Siguiente</a>
        </nav>
    </div>
    <footer class="fila">
        <a th:href="@{${rutas.MIS_SOLICITUDES}(filtro='cerradas')}"
           th:text="#{mis.archivadas(${archivadas})}">Cerradas</a>
        <a th:href="@{${rutas.MIS_INFORME}}"
           th:text="#{panel.informe}">Informe mensual</a>
    </footer>
</main>
</body>
</html>
