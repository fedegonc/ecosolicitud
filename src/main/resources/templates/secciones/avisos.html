<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.avisos}">Avisos</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{avisos.titulo}">Avisos</h1>
    <p class="mensaje mensaje--vacio" th:if="${avisos.isEmpty()}" th:text="#{${'avisos.vacia.' + #strings.toLowerCase(rolActual.name())}}">Vacía</p>
    <p class="ayuda" th:unless="${avisos.isEmpty()}" th:text="#{avisos.lectura}">Se marcan los avisos de esta página.</p>
    <p th:if="${pagina.totalPages > 1}" th:text="#{org.grupo.mostrando(${pagina.numberOfElements}, ${pagina.totalElements})}">Mostrando avisos</p>

    <!-- ciudadano: timeline con el estado actual de cada pedido -->
    <th:block th:if="${rolActual.name() == 'CIUDADANO' and !avisos.isEmpty()}">
    <ol th:fragment="timeline(avisos)" class="timeline">
        <li th:each="a : ${avisos}" th:classappend="('est-' + ${#strings.toLowerCase(a.estado().name())}) + (${!a.leida()} ? ' nueva' : '')">
            <a class="aviso-id" th:if="${a.solicitudId() != null}"
               th:href="@{${rutas.MIS_SOLICITUD}(id=${a.solicitudId()})}"
               th:text="'#' + ${a.solicitudId()}">#3</a>
            <span th:replace="~{componentes/estado :: etiqueta(${a.estado()})}"></span>
            <p class="aviso-texto" th:text="#{${a.tipo().clave}(${a.detalle()}, ${a.solicitudId() != null ? a.solicitudId().toString() : ''})}">Texto</p>
            <span class="detalle"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#calendario'"></use></svg><span
                  th:text="${#temporals.format(a.creadaEn(), 'dd/MM HH:mm')}">fecha</span></span>
        </li>
    </ol>
    </th:block>

    <!-- organización: kanban por dónde está el pedido ahora -->
    <th:block th:if="${rolActual.name() == 'ORGANIZACION' and !avisos.isEmpty()}">
    <div class="kanban" th:fragment="kanban(columnas)">
        <section class="kanban-col" th:each="c : ${columnas}"
                 th:classappend="'col-' + ${#strings.toLowerCase(#strings.substringAfter(c.clave(), '.'))}">
            <h2><span th:text="#{${c.clave()}}">Columna</span> <span class="kanban-cant" th:text="${c.avisos().size()}">0</span></h2>
            <article class="tarjeta caja" th:each="a : ${c.avisos()}"
                     th:classappend="('est-' + ${#strings.toLowerCase(a.estado().name())}) + (${!a.leida()} ? ' nueva' : '')">
                <div class="texto">
                    <a class="aviso-id" th:if="${a.solicitudId() != null}"
                       th:href="@{${rutas.ORG_SOLICITUD}(id=${a.solicitudId()})}"
                       th:text="'#' + ${a.solicitudId()}">#3</a>
                    <p class="aviso-texto" th:text="#{${a.tipo().clave}(${a.detalle()}, ${a.solicitudId() != null ? a.solicitudId().toString() : ''})}">Texto</p>
                    <dl><dt><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#calendario'"></use></svg></dt><dd
                          th:text="${#temporals.format(a.creadaEn(), 'dd/MM HH:mm')}">fecha</dd></dl>
                </div>
            </article>
        </section>
    </div>
    </th:block>
    <nav class="fila paginacion" th:if="${pagina.totalPages > 1}" th:attr="aria-label=#{paginacion.titulo}">
        <a class="caja" th:if="${pagina.hasPrevious()}"
           th:href="@{${rutas.AVISOS}(pagina=${pagina.number})}">
            <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha-izq'"></use></svg>
            <span th:text="#{paginacion.anterior}">Anterior</span>
        </a>
        <p th:text="#{paginacion.estado(${pagina.number + 1}, ${pagina.totalPages})}">Página 1 de 3</p>
        <a class="caja" th:if="${pagina.hasNext()}"
           th:href="@{${rutas.AVISOS}(pagina=${pagina.number + 2})}">
            <span th:text="#{paginacion.siguiente}">Siguiente</span>
            <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg>
        </a>
    </nav>
</main>
</body>
</html>
