catalogo.regla.superficies=Uma superfície informativa não é um botão: não muda de tamanho ao selecionar texto nem ao usar um controle dentro dela.
catalogo.regla.accesibilidad=O foco deve ser visível; os controles funcionam com teclado e respeitam a preferência por movimento reduzido.
catalogo.regla.voz=Usamos vizinho, centro e solicitação, com estados e ações coerentes em espanhol e português.
