<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cabecera(titulo, enlace)" class="cabecera">
    <h2 th:text="${titulo}"></h2>
    <a th:if="${enlace != null}" th:href="@{${enlace}}"><span th:text="#{ds.vertodo}">Ver todo</span><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg></a>
</div>
<a th:fragment="tarjeta(clave, imagen, enlace)" th:href="@{${enlace}}" class="caja tarjeta">
    <div class="imagen"><img th:if="${imagen != null}" th:src="@{${imagen}}" th:alt="#{${clave + '.titulo'}}"></div>
    <div class="texto">
        <strong th:text="#{${clave + '.titulo'}}"></strong>
        <span th:text="#{${clave + '.texto'}}"></span>
    </div>
</a>
<a th:fragment="accion(icono, clave, enlace)" th:href="@{${enlace}}" class="accion">
    <span class="circulo"><svg aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${icono}"></use></svg></span>
    <span th:text="#{${clave}}"></span>
</a>
<!-- saludo y camino a la izquierda, la ciudad a la derecha -->
<div th:fragment="saludo(pagina)" id="ds-saludo" class="saludo">
    <div>
        <p class="hola" th:if="${usuario != null}" th:text="#{portada.hola(${usuario})}">Hola, Ana</p>
        <p class="hola" th:if="${usuario == null and organizacionActiva != null}"
           th:text="#{portada.hola(${organizacionActiva.nombre})}">Hola, Centro</p>
        <nav class="camino" th:aria-label="#{miga.aria}">
            <ol>
                <li><span aria-current="page" th:text="#{miga.inicio}">Inicio</span></li>
                <li th:text="${pagina.localidad.nombre}">Rivera</li>
            </ol>
        </nav>
    </div>
    <nav id="ds-ciudad" th:aria-label="#{ds.ciudad}"
         hx-target=".pagina" hx-select=".pagina"
         hx-swap="outerHTML transition:true" hx-push-url="true">
        <details class="menu">
            <summary class="caja activa"><span th:text="${pagina.localidad.nombre}">Rivera</span><span aria-hidden="true">▾</span></summary>
            <div class="lista">
                <a class="caja" th:each="l : ${pagina.localidades}" th:unless="${l == pagina.localidad}"
                   th:href="@{${rutas.RAIZ}(ciudad=${l.slug})}"
                   th:attr="hx-get=@{${rutas.RAIZ}(ciudad=${l.slug})}"
                   th:text="${l.nombre}">Otra</a>
            </div>
        </details>
    </nav>
</div>
<!-- barra ancha: el estado del último pedido o la invitación a hacer el primero -->
<th:block th:fragment="ultimo(s)">
    <a th:if="${s != null}" id="ds-ultimo" class="caja banner ultimo"
       th:classappend="'est-' + ${#strings.toLowerCase(s.estado.name())}"
       th:href="@{${rutas.MIS_SOLICITUD}(id=${s.id})}" th:title="#{${s.estado.ayuda}}">
        <svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#' + ${s.estado.icono}"></use></svg>
        <strong th:text="#{portada.ultimo(${s.id})}">Tu último pedido #1</strong>
        <span th:text="#{${s.estado.clave}}">Estado</span>
        <svg class="icono flecha" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg>
    </a>
    <a th:if="${s == null}" id="ds-ultimo" class="caja banner ultimo" th:href="@{${rutas.NUEVA}}">
        <strong th:text="#{portada.sin.pedidos}">Todavía no pediste un retiro</strong>
        <svg class="icono flecha" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg>
    </a>
</th:block>
</body>
</html>
