<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{seccion.mis-solicitudes}">Mis solicitudes</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{seccion.mis-solicitudes}">Mis solicitudes</h1>
    <p class="aviso" role="status" th:if="${enviada}" th:text="#{mis.enviada(${enviada},${enviadaA})}">Aviso</p>
    <p class="aviso" role="status" th:if="${avisoCodigo}" th:text="#{${avisoCodigo}(${avisoId})}">Aviso</p>
    <p class="alerta" role="alert" th:if="${alertaCodigo}" th:text="#{${alertaCodigo}(${alertaId})}">Alerta</p>
    <header class="panel-cabecera">
        <p class="bienvenida" th:text="#{mis.bienvenida(${usuario})}">Hola</p>
        <p th:text="#{mis.bienvenida.detalle}">Panel</p>
        <p class="detalle" th:text="#{mis.semana(${semana.recibidas}, ${semana.aceptadas}, ${semana.completadas}, ${semana.mediana()})}">Semana</p>
    </header>
    <nav class="filtros">
        <a th:each="f : ${filtros}" th:href="@{/mis-solicitudes(filtro=${#strings.toLowerCase(f.name())})}"
           th:classappend="${f == filtro} ? 'activa'" th:attr="aria-current=${f == filtro} ? 'page' : null"
           th:text="#{${'mis.filtro.' + #strings.toLowerCase(f.name())}}">Todas</a>
    </nav>
    <p class="detalle" th:if="${solicitudes.isEmpty()}">
        <span th:text="#{mis.vacia}">No tenés solicitudes.</span>
        <a th:href="@{/nueva}" th:text="#{mis.nueva}">Nueva solicitud</a>
    </p>
    <div class="rejilla compacta">
    <article th:each="s : ${solicitudes}" class="tarjeta">
        <th:block th:replace="~{secciones/ficha :: cuerpo(${s}, ${s.organizacionNombre})}"></th:block>
        <div class="acciones" th:if="${s.estado.permiteCancelar()}">
            <form th:action="@{/mis-solicitudes/{id}/cancelar(id=${s.id})}" method="post">
                <input type="hidden" name="version" th:value="${s.version}">
                <button type="submit" class="accion peligro"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#cruz'"></use></svg><span th:text="#{accion.cancelar}">Cancelar</span></button>
            </form>
        </div>
    </article>
    </div>
    <footer class="panel-pie">
        <a class="enlace" th:href="@{/mis-solicitudes(filtro='cerradas')}"
           th:text="#{mis.archivadas(${archivadas})}">Cerradas</a>
        <a class="enlace" th:href="@{/mis-solicitudes/informe}"
           th:text="#{panel.informe}">Informe mensual</a>
    </footer>
</main>
</body>
</html>
