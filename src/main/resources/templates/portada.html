<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{app.nombre}">EcoSolicitud</title>
</head>
<body>
<main layout:fragment="content" class="ds">
    <div th:replace="~{componentes/ds :: encabezado(${pagina})}"></div>
    <div th:replace="~{componentes/ds :: grupos(${pagina})}"></div>
    <div th:replace="~{componentes/ds :: avisos(${pagina})}"></div>
    <div th:replace="~{componentes/ds :: ecosistema(${pagina})}"></div>
    <section id="ds-novedades" th:if="${!ultimas.isEmpty()}">
        <div th:replace="~{componentes/ds :: cabecera(#{portada.ultimas}, '/comunidad')}"></div>
        <ul class="novedades">
            <li th:each="p : ${ultimas}">
                <a th:href="@{/comunidad/{id}(id=${p.id})}">
                    <time th:datetime="${#temporals.formatISO(p.publicadaEn)}"
                          th:text="${#temporals.format(p.publicadaEn, 'd MMM')}">12 oct</time>
                    <strong th:text="${p.titulo}">Título</strong>
                    <span th:if="${p.organizacion != null}" th:text="${p.organizacion}">Organización</span>
                </a>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
