<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{app.nombre}">EcoSolicitud</title>
</head>
<body>
<main layout:fragment="content" class="ds">
    <div th:replace="~{componentes/ds :: saludo(${pagina})}"></div>
    <header id="ds-titulo" class="intro">
        <h1 th:text="#{${pagina.titulo}(${pagina.localidad.nombre})}">Reciclar en Rivera</h1>
        <p th:text="#{${pagina.subtitulo}(${pagina.localidad.nombre})}"></p>
        <p><a th:href="@{${rutas.AYUDA}}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#ayuda'"></use></svg><span th:text="#{ayuda.primera}">¿Primera vez? Mirá cómo se usa</span></a></p>
    </header>
    <nav id="ds-acciones" class="acciones" th:aria-label="#{ds.acciones}">
        <th:block th:each="a : ${pagina.acciones}">
            <a th:replace="~{componentes/ds :: accion(${a.icono}, ${a.clave}, ${a.enlace})}"></a>
        </th:block>
    </nav>
    <th:block th:if="${rolActual.name() == 'CIUDADANO'}">
        <a th:replace="~{componentes/ds :: ultimo(${ultimo})}"></a>
    </th:block>
    <section id="ds-consejos">
        <div th:replace="~{componentes/ds :: cabecera(#{ds.consejos}, ${rutas.GUIA})}"></div>
        <div class="grilla">
            <th:block th:each="t : ${pagina.consejos}">
                <a th:replace="~{componentes/ds :: tarjeta(${t.clave}, ${t.imagen}, ${t.enlace})}"></a>
            </th:block>
        </div>
    </section>
    <section id="ds-centros">
        <div th:replace="~{componentes/ds :: cabecera(#{seccion.acopios}, ${rutas.ACOPIOS})}"></div>
        <ul class="grilla">
            <li class="tarjeta caja" th:each="c : ${centros}">
                <a th:href="@{${rutas.ACOPIOS}}">
                    <strong th:text="${c.nombre}">Centro</strong>
                    <span class="tarjeta-detalle" th:text="${c.horario}">Horario</span>
                </a>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
