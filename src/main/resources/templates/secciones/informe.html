<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{informe.titulo}">Informe mensual</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="#{informe.titulo}">Informe mensual</h1>
    <p><span th:text="${titular}">Nombre</span> ·
        <span th:text="${informe.mes}">2026-10</span></p>
    <nav class="fila solo-pantalla">
        <a class="caja" th:href="${rutaInforme} + '?mes=' + ${informe.mes.minusMonths(1)}"
           hx-target="main" hx-select="main"
           th:text="#{informe.anterior}">← Mes anterior</a>
        <a class="caja" th:href="${rutaInforme} + '?mes=' + ${informe.mes.plusMonths(1)}"
           hx-target="main" hx-select="main"
           th:text="#{informe.siguiente}">Mes siguiente →</a>
        <a class="caja" th:href="${volver}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha-izq'"></use></svg><span th:text="#{panel.volver}">Volver</span></a>
    </nav>
    <p class="solo-pantalla"><button type="button" onclick="window.print()"
           th:text="#{informe.imprimir}">Imprimir</button></p>
    <p th:if="${informe.metricas.recibidas() == 0}" th:text="#{informe.vacio}">Vacío</p>
    <div class="rejilla">
        <article class="tarjeta caja">
            <strong th:text="${informe.metricas.recibidas()}">4</strong>
            <div class="texto"><span th:text="#{informe.recibidas}">Recibidas</span></div>
        </article>
        <article class="tarjeta caja">
            <strong th:text="${informe.metricas.aceptadas()}">3</strong>
            <div class="texto"><span th:text="#{informe.aceptadas}">Aceptadas</span></div>
        </article>
        <article class="tarjeta caja">
            <strong th:text="${informe.metricas.completadas()}">2</strong>
            <div class="texto"><span th:text="#{informe.completadas}">Completadas</span></div>
        </article>
        <article class="tarjeta caja">
            <strong th:text="${informe.metricas.mediana()}">6 h</strong>
            <div class="texto"><span th:text="#{informe.mediana}">Respuesta</span></div>
        </article>
    </div>
    <section>
        <h2 th:text="#{informe.por-estado}">Por estado</h2>
        <ul>
            <li th:each="e : ${informe.porEstado}"
                th:text="#{${e.key.clave}} + ' — ' + ${e.value}">Estado — 2</li>
        </ul>
        <h2 th:text="#{informe.por-material}">Por material</h2>
        <ul>
            <li th:each="m : ${informe.porMaterial}"
                th:text="${m.key} + ' — ' + ${m.value}">Papel — 2</li>
        </ul>
    </section>
    <section>
        <h2 th:text="#{informe.detalle}">Detalle</h2>
        <ul>
            <li th:each="s : ${informe.solicitudes}"
                th:text="'#' + ${s.id} + ' · ' + ${s.creada()} + ' · ' + ${s.nombreCiudadano} + ' · ' + ${s.direccion} + ' · ' + #{${s.estado.clave}}">Fila</li>
        </ul>
    </section>
</main>
</body>
</html>
