# Perfil de registro sobrio para producción: activar con
# SPRING_PROFILES_ACTIVE=prod,logs (o --spring.profiles.active=prod,logs).
# Solo advertencias y errores; Hibernate nunca imprime SQL ni parámetros.
logging.level.root=WARN
logging.level.com.ecosolicitud=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
spring.jpa.show-sql=false

# Access log corto: método, ruta, estado, bytes y milisegundos.
# Sin IP, sin User-Agent, sin datos personales. La revisión de las 3
# rutas de interés (/estadisticas, /mis-solicitudes, /avisos) se hace
# filtrando el log por ruta; Tomcat no permite loguear solo algunas.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%m %U %s %b %{ms}Tms
