<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="${articulo.titulo}">Artículo</title>
</head>
<body>
<main layout:fragment="content">
    <p><a th:href="@{/guia}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha-izq'"></use></svg><span th:text="#{guia.volver}">Volver</span></a></p>
    <article>
        <img th:if="${articulo.imagen != null}"
             th:src="@{/img/guia/{s}-1600.webp(s=${articulo.imagen})}"
             th:attr="srcset=@{/img/guia/{s}-800.webp(s=${articulo.imagen})} + ' 800w, ' + @{/img/guia/{s}-1600.webp(s=${articulo.imagen})} + ' 1600w'"
             sizes="(min-width: 45rem) 42rem, 100vw" width="1600" height="1200"
             th:alt="#{${'foto.guia.' + articulo.imagen}}">
        <h1 th:text="${articulo.titulo}">Título</h1>
        <p th:if="${articulo.material != null}">
            <span th:class="'etiqueta-material ' + 'mat-' + ${#strings.toLowerCase(articulo.material.codigo)}"
                  th:text="${articulo.material.nombre}">Material</span>
        </p>
        <th:block th:remove="tag" th:utext="${articulo.cuerpoHtml}">Cuerpo</th:block>
    </article>
    <section th:if="${!centros.isEmpty()}">
        <h2 th:text="#{guia.donde}">Dónde llevarlo</h2>
        <div class="rejilla">
            <article th:each="o : ${centros}" class="tarjeta caja">
                <div class="texto">
                    <h3 th:text="${o.nombre}">Centro</h3>
                    <span>
                        <span th:text="#{${o.ciudad.clave}}">Ciudad</span> ·
                        <span th:text="${o.horario}">Horario</span> ·
                        <a th:href="'tel:' + ${#strings.replace(o.telefono, ' ', '')}"
                           th:text="${o.telefono}">Teléfono</a>
                    </span>
                </div>
                <div class="fila">
                    <a class="caja"
                       th:href="@{/nueva(ciudad=${o.ciudad},organizacionId=${o.id})}"
                       th:text="#{acopios.pedir}">Pedir retiro</a>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
