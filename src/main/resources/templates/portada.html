<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{app}">
<head>
    <title th:text="#{app.nombre}">EcoSolicitud</title>
</head>
<body>
<main layout:fragment="content">
    <section class="portada">
        <div class="portada-hero">
            <div class="portada-texto">
                <h1 th:text="#{portada.claim}">Qué es</h1>
                <p class="detalle" th:text="#{portada.intro}">Intro</p>
                <p class="acciones-portada">
                    <a class="accion" th:href="${inicio}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#flecha'"></use></svg><span th:text="#{${cta}}">Pedir retiro</span></a>
                    <a class="enlace" th:href="@{/acopios}"><svg class="icono" aria-hidden="true"><use th:href="@{/img/iconos.svg} + '#edificio'"></use></svg><span th:text="#{portada.secundaria}">Ver centros</span></a>
                </p>
            </div>
            <figure class="foto-hero">
                <img th:src="@{/img/ciudad/plaza-1600.webp}"
                     th:attr="srcset=@{/img/ciudad/plaza-800.webp} + ' 800w, ' + @{/img/ciudad/plaza-1600.webp} + ' 1600w'"
                     sizes="(min-width: 45rem) 21rem, 50vw" width="1600" height="1200"
                     fetchpriority="high" th:alt="#{foto.plaza}">
            </figure>
        </div>
        <figure class="qr">
            <span th:utext="${qr}"></span>
            <figcaption class="detalle" th:text="#{portada.compartir}">Compartí</figcaption>
        </figure>
    </section>
    <section th:if="${!ultimas.isEmpty()}">
        <h2 th:text="#{portada.ultimas}">Lo último</h2>
        <div class="rejilla">
            <article th:each="p : ${ultimas}" class="tarjeta">
                <h3><a class="enlace" th:href="@{/comunidad/{id}(id=${p.id})}"
                       th:text="${p.titulo}">Título</a></h3>
                <p class="detalle" th:text="${p.resumen}">Resumen</p>
                <p class="detalle">
                    <span class="etiqueta" th:text="#{${p.tipo.clave}}">Tipo</span>
                    <span th:text="${p.fecha}">Fecha</span>
                </p>
            </article>
        </div>
    </section>
</main>
</body>
</html>
