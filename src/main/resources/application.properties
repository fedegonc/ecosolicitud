spring.application.name=ecosolicitud
spring.profiles.active=dev
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# N+1: las asociaciones EAGER (ciudadano de cada solicitud, materiales)
# se cargan por lotes de hasta 50 en vez de una consulta por fila
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.compression.enabled=true

# Sin credenciales no se puede activar la demo. El perfil prod nunca cambia.
ecosolicitud.modo.usuario=${MODO_ADMIN_USER:}
ecosolicitud.modo.clave=${MODO_ADMIN_PASSWORD:}
ecosolicitud.modo.clave-hash=${MODO_ADMIN_PASSWORD_HASH:}
ecosolicitud.demo.reiniciar=false

# Cuestionario de respaldo: sin CUESTIONARIO_DESTINO, MAIL_USERNAME y MAIL_PASSWORD las respuestas quedan solo en la base
ecosolicitud.cuestionario.destino=${CUESTIONARIO_DESTINO:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
